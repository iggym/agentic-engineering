name: validate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate metadata and articles
        run: python3 scripts/validate.py
      - name: Check generated files are up to date
        run: |
          python3 scripts/build.py
          git diff --exit-code -- sitemap.xml feed.xml index.html
